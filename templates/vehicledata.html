<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="card">
        <h1>🚗 Vehicle Insurance Prediction</h1>
        <p class="subtitle">Fill in the details below to predict if a customer is interested in vehicle insurance.</p>

        <form method="post" action="/">
            <div class="form-grid">
                <div class="form-group">
                    <label>👤 Gender</label>
                    <select name="Gender" required>
                        <option value="" disabled selected>-- Select --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📅 Age</label>
                    <input type="number" name="Age" placeholder="e.g. 35" min="18" max="100" required>
                </div>

                <div class="form-group">
                    <label>🪪 Driving License</label>
                    <select name="Driving_License" required>
                        <option value="" disabled selected>-- Select --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📍 Region Code</label>
                    <input type="number" step="0.1" name="Region_Code" placeholder="e.g. 28.0" required>
                </div>

                <div class="form-group">
                    <label>🛡️ Previously Insured</label>
                    <select name="Previously_Insured" required>
                        <option value="" disabled selected>-- Select --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💰 Annual Premium</label>
                    <input type="number" step="0.01" name="Annual_Premium" placeholder="e.g. 30000" required>
                </div>

                <div class="form-group">
                    <label>📞 Policy Sales Channel</label>
                    <input type="number" step="0.1" name="Policy_Sales_Channel" placeholder="e.g. 26.0" required>
                </div>

                <div class="form-group">
                    <label>⏳ Vintage (days)</label>
                    <input type="number" name="Vintage" placeholder="e.g. 150" min="0" max="300" required>
                </div>

                <div class="form-group">
                    <label>🚙 Vehicle Age</label>
                    <select name="Vehicle_Age" required>
                        <option value="" disabled selected>-- Select --</option>
                        <option value="< 1 Year">&lt; 1 Year</option>
                        <option value="1-2 Year">1-2 Years</option>
                        <option value="> 2 Years">&gt; 2 Years</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🔧 Vehicle Damage</label>
                    <select name="Vehicle_Damage" required>
                        <option value="" disabled selected>-- Select --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="predict-btn">🔍 Predict</button>
        </form>

        <form method="get" action="/train" style="margin-top: 1rem;">
            <button type="submit" class="train-btn">⚙️ Train Model</button>
        </form>

        {% if context %}
            <div class="result-card">
                <h2>Result: {{ context }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
